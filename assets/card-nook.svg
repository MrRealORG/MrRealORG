<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Nook: A cozy desktop app for Windows: notes, tasks, a desktop pet, voice dictation, cloud sync and focus music. Built with Tauri + Rust.">
