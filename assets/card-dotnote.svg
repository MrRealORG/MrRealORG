<svg xmlns="http://www.w3.org/2000/svg" width="590" height="270" viewBox="0 0 590 270" role="img" aria-label="DotNote: Minimal mono, local-first notes app for Windows with channels, voice and AI.">
  <title>DotNote</title>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1830"/><stop offset="1" stop-color="#0B0912"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#AE81FF"/><stop offset="1" stop-color="#AE81FF" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#AE81FF" stop-opacity="0.35"/><stop offset="1" stop-color="#AE81FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cc"><rect x="3" y="3" width="584" height="264" rx="15"/></clipPath>
    <style>
      .i { font: 700 14px 'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',Consolas,'DejaVu Sans Mono','Liberation Mono',monospace; fill: #8E88B0; letter-spacing: 2px; }
      .t { font: 800 30px 'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif; fill: #E8E4FF; }
      .s { font: 700 11.5px 'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',Consolas,'DejaVu Sans Mono','Liberation Mono',monospace; letter-spacing: 1.2px; }
      .d { font: 400 16.5px 'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif; fill: #C9C3E6; }
      .c { font: 700 12px 'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',Consolas,'DejaVu Sans Mono','Liberation Mono',monospace; }
      .g { font: 400 34px 'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif; }
      .orb { animation: orb 6s ease-in-out infinite; }
      @keyframes orb { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
      .live { animation: live 1.4s ease-in-out infinite; }
      @keyframes live { 50% { opacity: .2 } }
    </style>
  </defs>
  <rect x="1.5" y="1.5" width="587" height="267" rx="16" fill="url(#bg)" stroke="url(#bd)" stroke-width="2"/>
  <g clip-path="url(#cc)"><circle class="orb" cx="550" cy="30" r="150" fill="url(#orb)"/></g>
  <rect x="1.5" y="26" width="4" height="54" rx="2" fill="#AE81FF" filter="url(#glow)"/>
  <text x="34" y="44" class="i">06</text>
  <text x="34" y="86" class="t">DotNote</text>
  <g transform="translate(421.4,26)">
    <rect width="134.6" height="26" rx="13" fill="#A9FEF7" fill-opacity="0.14" stroke="#A9FEF7" stroke-opacity="0.8"/>
    <circle class="live" cx="13" cy="13" r="4" fill="#A9FEF7"/>
    <text x="25" y="17.5" class="s" fill="#A9FEF7">OPEN SOURCE</text>
  </g>
  <text x="34" y="122" class="d">Minimal mono, local-first notes app for Windows</text><text x="34" y="147" class="d">with channels, voice and AI.</text>
  <g transform="translate(34,220)"><rect width="61.2" height="26" rx="13" fill="#AE81FF" fill-opacity="0.12" stroke="#AE81FF" stroke-opacity="0.55"/><text x="30.6" y="17.5" text-anchor="middle" class="c" fill="#AE81FF">RUST</text></g><g transform="translate(103.2,220)"><rect width="96.4" height="26" rx="13" fill="#AE81FF" fill-opacity="0.12" stroke="#AE81FF" stroke-opacity="0.55"/><text x="48.2" y="17.5" text-anchor="middle" class="c" fill="#AE81FF">TAURI V2</text></g>
  
</svg>